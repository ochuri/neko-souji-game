<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#211f2b" />
    <meta name="description" content="掃除機目線で猫毛を集める60秒のスマホゲーム" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='25' font-size='24'%3E🐾%3C/text%3E%3C/svg%3E" />
    <title>ねこ毛、いただきます。</title>
    <link rel="stylesheet" href="./styles.css?v=pixel4" />
  </head>
  <body>
    <main id="app" aria-label="ねこ毛掃除ゲーム">
      <canvas id="game" aria-label="床すれすれの掃除機視点のゲーム画面"></canvas>
      <img id="robot-foreground" class="robot-foreground" src="./public/assets/robot-foreground-v4-pixel.png" alt="" aria-hidden="true" />

      <section id="hud" class="hud" aria-live="polite">
        <div class="hud-item"><span id="grams">0.0</span><small>g</small></div>
        <div class="hud-item hud-time"><span id="time">60</span><small>sec</small></div>
      </section>

      <div id="message" class="message" aria-live="assertive"></div>

      <section id="controls" class="controls" aria-label="ゲーム操作">
        <div id="joystick" class="joystick" aria-label="移動スティック">
          <span id="stick" class="stick"></span>
        </div>
      </section>

      <section id="intro" class="panel intro-panel">
        <p class="eyeline">60 SEC CLEANUP</p>
        <h1>ねこ毛、<br />いただきます。</h1>
        <p>床すれすれを走って、ふわふわを集めよう。<br />猫がかいかいしたら、新しい毛のチャンス。</p>
        <div class="howto">
          <span>スティックの方向へ移動</span><i></i><span>毛に乗ると自動吸引</span>
        </div>
        <button id="start" class="primary" type="button">そうじをはじめる</button>
      </section>

      <section id="result" class="panel result-panel" hidden>
        <p id="result-kicker" class="eyeline">CLEANUP COMPLETE</p>
        <h2><span id="result-grams">0.0</span><small> g</small></h2>
        <p id="result-copy">今日も、いい毛でした。</p>
        <dl>
          <div><dt>虎太郎の毛</dt><dd id="kotaro-count">0</dd></div>
          <div><dt>ゆらぎの毛</dt><dd id="yuragi-count">0</dd></div>
        </dl>
        <button id="restart" class="primary" type="button">もういちど</button>
      </section>
    </main>
    <script type="module" src="./src/game.js?v=pixel4"></script>
  </body>
</html>
